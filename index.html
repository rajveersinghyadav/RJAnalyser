<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RJAnalyser AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<h1>📈 RJAnalyser</h1>

<p>AI Powered Trading Analysis Platform</p>

</header>

<div class="container">

<div class="card">

<h2>🤖 AI Brain</h2>

<p>Status : Online</p>

<button>Start AI</button>

</div>

<div class="card">

<h2>📊 Chart Analysis</h2>

<input type="text" id="chartLink" placeholder="Paste Trading Chart Link">

<button onclick="analyzeChart()">Analyze Chart</button>

</div>

<div class="card">

<h2>🧠 Learning Engine</h2>

<textarea id="teachAI" placeholder="Teach your AI new strategy..."></textarea>

<button onclick="saveLearning()">Save Learning</button>

</div>

<div class="card">

<h2>💾 AI Memory</h2>

<p id="memoryStatus">Memory Ready...</p>

<button onclick="openMemory()">Open Memory</button>

</div>

<div class="card">

<h2>⚙️ Settings</h2>

<button>AI Settings</button>

<button>Future Modules</button>

</div>

<div class="card output">

<h2>📋 AI Result</h2>

<div id="result">

Waiting for Analysis...

</div>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
