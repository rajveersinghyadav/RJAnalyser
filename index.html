<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJAnalyser AI - MT5 Terminal</title>
    <style>
        body { margin: 0; background-color: #1c1e22; color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .tab-content { display: none; padding: 15px; flex-grow: 1; overflow-y: auto; }
        .active { display: block; }
        .nav-bar { display: flex; justify-content: space-around; background: #252830; padding: 10px; position: fixed; bottom: 0; width: 100%; }
        .nav-btn { cursor: pointer; text-align: center; font-size: 12px; }
        /* MT5 Style */
        .mt5-history-container { background: #1c1e22; color: #fff; }
        .trade-row { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding: 10px 0; }
        .summary-box { margin-top: 20px; border-top: 1px solid #333; padding-top: 10px; }
    </style>
</head>
<body>

    <!-- HISTORY TAB CONTENT -->
    <div id="history-tab" class="tab-content active">
        <div class="mt5-history-container">
            <h3>Order History</h3>
            <div id="mt5-trades-list"></div>
            <div class="summary-box">
                <div style="display:flex; justify-content:space-between;"><span>Deposit</span><span>5 000.00</span></div>
                <div style="display:flex; justify-content:space-between;"><span>Profit</span><span id="prof" style="color:#3b82f6;">+0.00</span></div>
                <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:16px;">
                    <span>Balance</span><span id="bal">5 000.00</span>
                </div>
            </div>
        </div>
    </div>

    <!-- NAVIGATION -->
    <div class="nav-bar">
        <div class="nav-btn" onclick="showTab('history-tab')">History</div>
    </div>

    <script src="api/executor.js"></script>
    <script>
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }
    </script>
</body>
</html>
